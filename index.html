<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Central SDR BeeFood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#FBF7F6; --surface:#FFFFFF; --surface-2:#F4ECEB; --ink:#1E1416; --muted:#6D5F62; --line:#E6DAD9;
  --red:#C8102E; --red-ink:#FFFFFF; --red-soft:#FBE3E6; --honey:#F2B705; --honey-soft:#FDF2CC; --honey-ink:#5A4300;
  --bubble:#E9F7E4; --bubble-ink:#16301A; --ok:#1F8A4C; --side:#1E1416; --side-ink:#F4ECEC; --side-muted:#B3A4A7; --side-hover:#2E2326;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#151012; --surface:#1F181A; --surface-2:#2A2124; --ink:#F4ECEC; --muted:#B3A4A7; --line:#3A2F32;
    --red:#FF5A6E; --red-ink:#1A0508; --red-soft:#3A1920; --honey:#F5C542; --honey-soft:#3A3014; --honey-ink:#F7DC8A;
    --bubble:#1D3323; --bubble-ink:#DDF3E1; --ok:#5FD08F; --side:#0E0A0B; --side-ink:#F4ECEC; --side-muted:#9C8D90; --side-hover:#231B1D;}
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#151012; --surface:#1F181A; --surface-2:#2A2124; --ink:#F4ECEC; --muted:#B3A4A7; --line:#3A2F32;
  --red:#FF5A6E; --red-ink:#1A0508; --red-soft:#3A1920; --honey:#F5C542; --honey-soft:#3A3014; --honey-ink:#F7DC8A;
  --bubble:#1D3323; --bubble-ink:#DDF3E1; --ok:#5FD08F; --side:#0E0A0B; --side-ink:#F4ECEC; --side-muted:#9C8D90; --side-hover:#231B1D;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Figtree",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;text-wrap:balance;margin:0}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--red)}
:focus-visible{outline:3px solid var(--honey);outline-offset:2px;border-radius:6px}
.hex{display:inline-block;width:.72em;height:.82em;background:var(--honey);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}

/* shell */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:20px}
.brand small{display:block;font-family:"Figtree",sans-serif;font-weight:500;font-size:12px;color:var(--side-muted);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted);padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-weight:500;font-size:14.5px}
.nav a:hover{background:var(--side-hover)}
.nav a.on{background:var(--red);color:#fff}
.nav a .n{margin-left:auto;font-size:12px;opacity:.7}
.side .foot{margin-top:auto;font-size:12.5px;color:var(--side-muted);padding:0 8px}
.content{min-width:0;padding-inline:32px;padding-block:28px 72px}
.inner{max-width:1080px;margin:0 auto}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:5;height:auto;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));gap:10px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px}
  .nav .grp{display:none}
  .nav a{white-space:nowrap;padding:7px 12px}
  .nav a .n{display:none}
  .side .foot{display:none}
  .content{padding-inline:16px;padding-block:20px 64px}
}

/* top bar */
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:24px}
.search{flex:1;min-width:220px;max-width:460px;position:relative}
.search input{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.crumb{font-size:13px;color:var(--muted)}

.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);font-weight:700}
.ph{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:24px}
.ph h1{font-size:clamp(28px,4.5vw,42px);font-weight:800;line-height:1.05;margin-top:6px}
.lede{color:var(--muted);max-width:62ch;margin:8px 0 0}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13.5px;font-weight:600}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn:hover{filter:brightness(.97)}
.btn.ok{color:var(--ok);border-color:var(--ok)}

/* home */
.hero{background:var(--side);color:var(--side-ink);border-radius:20px;padding:32px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;align-items:center}
.hero h1{font-size:clamp(30px,4.8vw,48px);font-weight:800;line-height:1.02}
.hero h1 em{font-style:normal;color:var(--honey)}
.hero p{color:var(--side-muted);max-width:56ch}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fact{background:var(--side-hover);border-radius:12px;padding:14px}
.fact b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:24px;color:var(--honey);line-height:1.1}
.fact span{font-size:13px;color:var(--side-muted)}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding:22px}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:22px}
.card{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;color:var(--ink)}
.card:hover{border-color:var(--red)}
.card b{font-size:16px}
.card span{font-size:13.5px;color:var(--muted)}
.prose{max-width:68ch}
.prose p{margin:0 0 12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:26px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.box h2{font-size:20px;margin-bottom:10px}

/* flow */
.fgrid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px}
@media (max-width:1100px){.fgrid{grid-template-columns:1fr}}
.fside .sticky{position:sticky;top:16px;display:flex;flex-direction:column;gap:16px}
@media (max-width:1100px){.fside .sticky{position:static}.fside{order:2}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h3{font-size:15px;font-weight:600;margin-bottom:10px}
.map{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.map a{display:grid;grid-template-columns:40px 1fr;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px}
.map a:hover{background:var(--surface-2)}
.map a.cur{background:var(--red-soft)}
.map .code{font-size:12px;color:var(--muted)}
.map a.cur .code{color:var(--red)}
.map .done::after{content:" ✓";color:var(--ok);font-weight:700}
.sum dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:13.5px}
.sum dt{color:var(--muted)}
.sum dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.sum dd.empty{font-weight:400;color:var(--muted)}
.sum .actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.steps{display:flex;flex-direction:column;gap:16px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;scroll-margin-top:90px}
.step.active{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.step-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:14px}
.step-head .code{font-size:12.5px;background:var(--surface-2);padding:3px 8px;border-radius:6px;color:var(--muted)}
.step-head h2{font-size:20px;font-weight:600}
.when{font-size:13px;color:var(--muted);width:100%}
.chat{display:flex;gap:12px;align-items:flex-start}
.bubble{flex:1;min-width:0;background:var(--bubble);color:var(--bubble-ink);border-radius:4px 14px 14px 14px;padding:14px 16px;white-space:pre-line;overflow-wrap:anywhere}
.bubble a{color:inherit}
.note{margin-top:12px;background:var(--honey-soft);color:var(--honey-ink);border-radius:10px;padding:10px 14px;font-size:14px;white-space:pre-line}
.note b{font-weight:700}
.opts{margin-top:16px}
.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
.opt-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.opt{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
.opt:hover{border-color:var(--red)}
.opt.sel{border-color:var(--red);background:var(--red-soft)}
.opt .a{font-weight:600}
.opt .go{font-size:12.5px;color:var(--muted)}
.opt.sel .go{color:var(--red)}
.field{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
@media (max-width:560px){.chat{flex-direction:column}.chat>.btn{align-self:flex-end}}

/* knowledge */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kgroup{margin-bottom:26px}
.kgroup>h2{font-size:18px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.kgroup>h2 .c{font-family:"Figtree",sans-serif;font-size:13px;color:var(--muted);font-weight:500}
.klist{display:flex;flex-direction:column;gap:8px}
details.k{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.k[open]{border-color:var(--red)}
details.k summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:10px;font-weight:600}
details.k summary::-webkit-details-marker{display:none}
details.k summary::after{content:"+";margin-left:auto;font-size:20px;line-height:1;color:var(--muted)}
details.k[open] summary::after{content:"–"}
details.k .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--surface-2);color:var(--muted);padding:2px 7px;border-radius:5px;font-weight:700}
.kbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.kbody .txt{white-space:pre-line;overflow-wrap:anywhere}
.kbody .chat .bubble{font-size:14.5px}
mark{background:var(--honey-soft);color:var(--honey-ink);border-radius:3px;padding:0 2px}

/* plans */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
.plan.top{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.plan h2{font-size:24px;font-weight:800}
.plan .tagline{color:var(--muted);font-size:14px;margin-top:2px}
.price{display:grid;gap:8px;font-variant-numeric:tabular-nums}
.price .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;border-top:1px dashed var(--line);padding-top:8px}
.price .row:first-child{border-top:0;padding-top:0}
.price .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.price .v{white-space:nowrap;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px}
.price .s{font-size:13px;color:var(--muted);text-align:right}
.feat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.feat li{display:grid;grid-template-columns:14px 1fr;gap:8px}
.feat li::before{content:"";width:9px;height:10px;margin-top:6px;background:var(--honey);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.feat .inh{font-weight:700;color:var(--red)}
.feat .inh::before{background:var(--red)}

/* pipeline */
.pipe{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.pst{flex:1 0 150px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;position:relative}
.pst b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:17px}
.pst span{font-size:13px;color:var(--muted)}
.pst.hot{border-color:var(--red)}
.pst.hot b{color:var(--red)}
.pst.cold{background:var(--surface-2)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.rule h3{font-size:16px;font-weight:600;margin-bottom:6px}
.rule p{margin:0;white-space:pre-line;font-size:14.5px;color:var(--ink)}
.rule.alert{border-color:var(--red);background:var(--red-soft)}
.sec-h{font-size:22px;margin:28px 0 12px}
.empty{color:var(--muted);padding:30px 0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:10}
@media (prefers-reduced-motion:no-preference){.step,.card,details.k{transition:border-color .2s,box-shadow .2s}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand"><span class="hex" aria-hidden="true"></span><div>BeeFood<small>Central SDR</small></div></div>
    <nav class="nav" id="nav" aria-label="Seções"></nav>
    <div class="foot">Site sempre em atualização. Se não achou alguma informação, solicite contato com a Nicolly.</div>
  </aside>
  <div class="content"><div class="inner">
    <div class="topbar">
      <label class="search" for="q"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Buscar: totem, Stone, nota fiscal, planos…" autocomplete="off" aria-label="Buscar no site"></label>
      <span class="crumb" id="crumb"></span>
    </div>
    <div id="view"></div>
  </div></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ====================== CONTEÚDO ====================== */
const FIM_NOTE="<b>“Estou com dúvida”:</b> envie a mensagem acima e responda.\n<b>“Pode mostrar”:</b> crie o resumo e passe o lead para o próximo vendedor, com a anotação no comentário do Bitrix.";
const ABERTURA="Olá, (NOME)! Tudo bem? 😊\nSou a (SDR) da BeeFood 🐝\nVou te fazer algumas perguntas rápidas para entender melhor o seu negócio e identificar como o BeeFood pode ajudar.\nHoje vocês trabalham com:\n1️⃣ Delivery\n2️⃣ Presencial\n3️⃣ Delivery + Presencial";
const PROCURA="Maravilha (FULANO), e hoje, qual é a maior dificuldade ou o principal ponto que você gostaria de melhorar na gestão do seu restaurante? 😊";
const PROCURA_NOTE="<b>SDR:</b> explique se temos ou não a necessidade que o lead busca.";
const GESTAO="Só confirmando: controle de estoque e financeiro são essenciais para sua operação? 😄\n1️⃣ Controle de estoque\n2️⃣ Financeiro\n3️⃣ Ambos";
const SISTEMA="Hoje, você conta com algum sistema de gestão para te ajudar na operação? 😊\n1️⃣ Sim\n2️⃣ Não";
const FINAL="Sobre o que conversamos ficou com alguma dúvida ou posso te mostrar o plano ideal?\n1- Pode mostrar\n2- Estou com dúvida";
const SEMPC="Obrigada por confirmar! 😊\nPara uma experiência completa, o ideal é usar computador ou notebook. 💻\nVocê já tem previsão de quando terá acesso a um?";
const FLOWS={
delivery:{title:"Roteiro Delivery",lede:"Versão válida desde 21/09. Siga as mensagens na ordem e clique na resposta do lead para ir à próxima etapa. O resumo para o vendedor se monta sozinho.",
 keys:["Operação","Entregas","Dispositivo","Previsão de PC","Dificuldade","Gestão","Usa sistema","Fechamento"],
 steps:[
 {id:"s01",code:"01",title:"Abertura",when:"OFC_COMERCIAL · primeira mensagem para todo lead.",msg:ABERTURA,
  key:"Operação",opts:[["1️⃣ Delivery","s02"],["2️⃣ Presencial","@presencial"],["3️⃣ Delivery + Presencial","s02"]]},
 {id:"s02",code:"02",title:"Tipo de entrega",when:"Lead respondeu Delivery ou Delivery + Presencial.",
  msg:"Perfeito! 🚀\nA BeeFood tem robô integrado ao WhatsApp + cardápio digital para agilizar seus pedidos. 🐝\nHoje, suas entregas são feitas por:\n1️⃣ Motoboy próprio\n2️⃣ Marketplaces (IFOOD, UAIRANGO, KEETA)\n3️⃣ Ambos",
  key:"Entregas",opts:[["1️⃣ Motoboy próprio","s04"],["2️⃣ Marketplaces","s03"],["3️⃣ Ambos","s03"]]},
 {id:"s03",code:"03",title:"Usa marketplaces",when:"USA MKT_COMERCIAL · lead usa marketplaces (ou marketplaces + motoboy).",
  msg:"Legal! 😊\nA BeeFood integra com iFood, 99Food, Keeta, UaiRango, Rappi, Delivery Much e Aiqfome, centralizando seus pedidos em um só lugar. 🚀\n📍 Se você usa iFood, temos o Entrega Fácil, que permite solicitar motoboys direto pelo sistema. 🛵\nHoje vocês utilizam:\n1️⃣ Computador/notebook\n2️⃣ Celular\n3️⃣ Ambos",
  note:"<b>Respondeu “Ambos” na etapa 02?</b> Cite também o app para entregadores da etapa 04.",
  key:"Dispositivo",opts:[["1️⃣ Computador/notebook","s07"],["2️⃣ Celular","nopc"],["3️⃣ Ambos","s07"]]},
 {id:"s04",code:"04",title:"Usa motoboy",when:"MOTOBOY_COMERCIAL · lead usa só motoboy próprio.",
  msg:"(FULANO), também temos um app para entregadores, com acompanhamento e rotas inteligentes. 🚀\nHoje vocês utilizam:\n1️⃣ Computador/notebook\n2️⃣ Celular\n3️⃣ Ambos",
  key:"Dispositivo",opts:[["1️⃣ Computador/notebook","s07"],["2️⃣ Celular","nopc"],["3️⃣ Ambos","s07"]]},
 {id:"nopc",code:"06",title:"Sem PC",when:"SEM PC_COMERCIAL · lead respondeu que usa só celular.",msg:SEMPC,
  key:"Previsão de PC",free:"em 2 semanas",next:"s07"},
 {id:"s07",code:"07",title:"Principal dificuldade",when:"PROCURA_COMERCIAL · depois de saber o dispositivo.",msg:PROCURA,note:PROCURA_NOTE,
  key:"Dificuldade",free:"controle de estoque",next:"s08"},
 {id:"s08",code:"08",title:"Confirmar gestão",when:"GESTÃO_COMERCIAL · depois de explicar as soluções.",msg:GESTAO,
  key:"Gestão",opts:[["1️⃣ Controle de estoque","sis"],["2️⃣ Financeiro","sis"],["3️⃣ Ambos","sis"]]},
 {id:"sis",code:"09",title:"Usa sistema",when:"USA SISTEMA · logo após a confirmação de gestão.",msg:SISTEMA,
  key:"Usa sistema",opts:[["1️⃣ Sim","s09"],["2️⃣ Não","s09"]]},
 {id:"s09",code:"09B",title:"Dúvida ou plano",when:"FINAL_COMERCIAL · fechamento da qualificação.",msg:FINAL,
  key:"Fechamento",opts:[["1- Pode mostrar","fim"],["2- Estou com dúvida","fim"]]},
 {id:"fim",code:"10",title:"Próximo passo",when:"Continuar.final · conforme a resposta anterior.",msg:"Qual seria a sua dúvida?",note:FIM_NOTE}

const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const linkify=s=>esc(s).replace(/https?:\/\/[^\s<]+/g,u=>{let h=u;try{const x=new URL(u.replace(/&amp;/g,'&'));h=x.hostname.replace(/^www\./,'')+(x.pathname.length>1?x.pathname.slice(0,28)+(x.pathname.length>28?'…':''):'')}catch(e){}return `<a href="${u}" target="_blank" rel="noopener">${h}</a>`});
const clean=t=>t.replace(/^(\d\uFE0F?\u20E3|\d-)\s*/,'');
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const hl=(html,q)=>{if(!q)return html;const re=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");return (">"+html).replace(/(>[^<]*)/g,m=>m.replace(re,"<mark>$1</mark>")).slice(1)};

 const steps=F.steps.map(s=>{const id="c"+(cid++);COPY[id]=s.msg;return `
  <section class="step${s.id===S.cur?' active':''}" id="${s.id}">
   <div class="step-head"><span class="code mono">${s.code}</span><h2>${s.title}</h2><span class="when">${s.when}</span></div>
   <div class="chat"><div class="bubble">${esc(s.msg)}</div>${copyBtn(id)}</div>
   ${s.note?`<div class="note">${s.note}</div>`:""}
   ${s.extra?(()=>{const x="c"+(cid++);COPY[x]=s.extra[1];return `<div class="opts"><div class="lbl">${s.extra[0]}</div><div class="chat"><div class="bubble">${esc(s.extra[1])}</div>${copyBtn(x)}</div></div>`})():""}
   ${s.opts?`<div class="opts"><div class="lbl">Resposta do lead</div><div class="opt-list">${s.opts.map((o,i)=>`
     <button class="opt${S.ans[s.key]===clean(o[0])?' sel':''}" type="button" data-flow="${key}" data-step="${s.id}" data-i="${i}">
     <span class="a">${o[0]}</span><span class="go">→ ${label[o[1]]}</span></button>`).join("")}</div></div>`:""}
   ${s.free?`<div class="opts"><div class="lbl">Anotar resposta</div><div class="chat">
     <input class="field" id="f-${s.id}" value="${esc(S.ans[s.key]||'')}" placeholder="Ex.: ${s.free}">
     <button class="btn primary" type="button" data-flow="${key}" data-next="${s.id}">Seguir → ${label[s.next]}</button></div></div>`:""}
  </section>`}).join("");
 const map=F.steps.map(s=>`<li><a href="#${s.id}" data-flow="${key}" data-jump="${s.id}" class="${s.id===S.cur?'cur':''}"><span class="code mono">${s.code}</span><span class="${s.key&&S.ans[s.key]?'done':''}">${s.title}</span></a></li>`).join("");
 const sum=F.keys.filter(k=>k!=="Previsão de PC"||S.ans[k]).map(k=>`<dt>${k}</dt><dd class="${S.ans[k]?'':'empty'}">${S.ans[k]?esc(S.ans[k]):'—'}</dd>`).join("");
 return head("Prospecção",F.title,F.lede,`<a class="btn" href="#${other}">Ir para ${FLOWS[other].title} →</a>`)+
  `<div class="fgrid"><aside class="fside"><div class="sticky">
    <div class="panel"><h3>Mapa da conversa</h3><ol class="map">${map}</ol></div>
    <div class="panel sum"><h3>Resumo para o vendedor</h3><dl>${sum}</dl>
     <div class="actions"><button class="btn primary" type="button" data-sum="${key}">Copiar resumo</button><button class="btn" type="button" data-reset="${key}">Novo lead</button></div></div>
   </div></aside><div class="steps">${steps}</div></div>`}

function vPlanos(){
 const cards=PLANOS.map(p=>`<article class="plan${p.top?' top':''}"><div><h2>${p.i} ${p.n}</h2><div class="tagline">${p.t}</div></div>
  <div class="price">
   <div class="row"><span class="k">Anual</span><span><span class="v">${p.anual}</span></span></div>
   <div class="row"><span class="k">Anual no Pix (−5%)</span><span class="v">${p.pix}</span></div>
   <div class="row"><span class="k">Cartão</span><span class="s">até ${p.x}<br>sem juros</span></div>
   <div class="row"><span class="k">Mensal</span><span><span class="v">${p.mensal}</span><div class="s">+ R$ 150,00 de implantação no 1º mês</div></span></div>
  </div>
  <ul class="feat">${p.inh?`<li class="inh">${p.inh}</li>`:''}${p.f.map(x=>`<li>${x}</li>`).join("")}</ul></article>`).join("");
 return head("Consulta","Planos e preços","Valores e o que cada plano inclui. Abaixo, as mensagens prontas para enviar ao lead.")+
  `<div class="plans">${cards}</div><h2 class="sec-h">Mensagens sobre planos</h2><div class="klist">${PLANO_MSGS.map(([t,o])=>kItem(t,o)).join("")}</div>`}

function vFunc(){
 const cats=["Todas",...new Set(KB.map(k=>k[0]))];
 const chips=`<div class="chips">${cats.map(c=>`<button class="chip${state.cat===c?' on':''}" type="button" data-cat="${c}">${c}</button>`).join("")}</div>`;
 const groups=cats.slice(1).filter(c=>state.cat==="Todas"||state.cat===c).map(c=>{const it=KB.filter(k=>k[0]===c);
  return `<div class="kgroup"><h2>${c} <span class="c">${it.length}</span></h2><div class="klist">${it.map(k=>kItem(k[1],k[2])).join("")}</div></div>`}).join("");
 return head("Consulta","Funcionalidades","O que cada funcionalidade faz, com a mensagem pronta para copiar. Orientações internas aparecem em amarelo e não vão para o lead.")+chips+groups}

function vDuvidas(){return head("Consulta","Dúvidas gerais","Respostas para as perguntas que os leads mais fazem.")+`<div class="klist">${FAQ.map(([t,o])=>kItem(t,o)).join("")}</div>`}

function vPraticas(){
 return head("Time","Boas práticas SDR","Como nos comunicamos com o lead e organizamos o trabalho.")+
 `<div class="box" style="margin-bottom:26px"><h2>Como funciona o Bitrix</h2><p class="lede" style="margin:0 0 14px">GDC = dia de tentativa de contato. O lead avança uma etapa por dia sem resposta.</p>
   <div class="pipe">${BITRIX.map(b=>`<div class="pst ${b[2]||''}"><b>${b[0]}</b><span>${b[1]}</span></div>`).join("")}</div>
   <div class="note" style="margin-top:14px"><b>AQUECIMENTO:</b> leads especiais que já tiveram conversa anterior, mas ainda têm dúvidas. Acompanhe de perto.</div></div>`+
 PRATICAS.map(([g,it])=>`<h2 class="sec-h">${g}</h2><div class="rules">${it.map(r=>`<div class="rule${r[2]?' alert':''}"><h3>${r[0]}</h3><p>${esc(r[1])}</p></div>`).join("")}</div>`).join("")}

function vRegras(){return head("Time","Regras BeeFood","Regras internas de convivência, horários e processos.")+`<div class="rules">${REGRAS.map(r=>`<div class="rule${r[2]?' alert':''}"><h3>${r[0]}</h3><p>${esc(r[1])}</p></div>`).join("")}</div>`}

function vBusca(q){
 const nq=norm(q),m=o=>norm(o.join(" ")).includes(nq);
 const res=[];
 KB.forEach(k=>{if(m([k[1],k[2].m||"",k[2].n||""]))res.push(kItem(k[1],k[2],k[0],q,true))});
 PLANO_MSGS.forEach(k=>{if(m([k[0],k[1].m||""]))res.push(kItem(k[0],k[1],"Planos",q,true))});
 FAQ.forEach(k=>{if(m([k[0],k[1].m||"",k[1].n||""]))res.push(kItem(k[0],k[1],"Dúvida",q,true))});
 PRATICAS.forEach(([g,it])=>it.forEach(r=>{if(m([r[0],r[1]]))res.push(kItem(r[0],{n:r[1]},"Boa prática",q,true))}));
 REGRAS.forEach(r=>{if(m([r[0],r[1]]))res.push(kItem(r[0],{n:r[1]},"Regra",q,true))});
 return head("Busca",`Resultados para “${esc(q)}”`,`${res.length} ${res.length===1?'resultado':'resultados'} em funcionalidades, planos, dúvidas, boas práticas e regras.`)+
  (res.length?`<div class="klist">${res.join("")}</div>`:`<p class="empty">Nada encontrado. Tente outra palavra ou solicite contato com a Nicolly.</p>`)}

function render(scrollTo){
 for(const k in COPY)delete COPY[k];cid=0;
 const q=state.q.trim();
 const V={inicio:vInicio,delivery:()=>vFlow("delivery"),presencial:()=>vFlow("presencial"),planos:vPlanos,funcionalidades:vFunc,duvidas:vDuvidas,praticas:vPraticas,regras:vRegras};
 $("#view").innerHTML=q.length>=2?vBusca(q):V[state.route]();
 const r=ROUTES.find(x=>x.id===state.route);$("#crumb").textContent=q.length>=2?"":(r.grp?r.grp+" · ":"")+r.label;
 nav();
 const on=document.querySelector("#nav a.on");on&&on.scrollIntoView({block:"nearest",inline:"nearest"});
 if(scrollTo){const el=document.getElementById(scrollTo);el&&el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}
}
function route(){const h=location.hash.slice(1);const r=ROUTES.find(x=>x.id===h);if(r){state.route=r.id;state.q="";$("#q").value="";render();window.scrollTo(0,0)}}
window.addEventListener("hashchange",route);

function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>e.hidden=true,1600)}
async function copy(text,btn){
 try{await navigator.clipboard.writeText(text);toast("Copiado");if(btn){const o=btn.textContent;btn.classList.add("ok");btn.textContent="Copiado";setTimeout(()=>{btn.classList.remove("ok");btn.textContent=o},1400)}}
 catch(e){toast("Selecione o texto e copie com Ctrl+C")}
}
function goStep(key,id){state.flow[key].cur=id;render(id)}
function switchFlow(to,from){state.route=to;const a=state.flow[from].ans["Operação"];if(a)state.flow[to].ans["Operação"]=a;history.replaceState(null,"","#"+to);render();window.scrollTo(0,0);toast("Continue no "+FLOWS[to].title)}

document.addEventListener("click",e=>{
 const na=e.target.closest("#nav a, .card");if(na&&na.getAttribute("href")==="#"+state.route&&state.q){e.preventDefault();state.q="";$("#q").value="";render();return}
 const c=e.target.closest("[data-copy]");if(c){copy(COPY[c.dataset.copy],c);return}
 const cat=e.target.closest("[data-cat]");if(cat){state.cat=cat.dataset.cat;render();return}
 const o=e.target.closest(".opt[data-flow]");if(o){const key=o.dataset.flow,S=state.flow[key],s=FLOWS[key].steps.find(x=>x.id===o.dataset.step),[txt,nx]=s.opts[+o.dataset.i];
   S.ans[s.key]=clean(txt);
   if(s.key==="Dispositivo"&&!/nopc/.test(nx))delete S.ans["Previsão de PC"];
   if(nx[0]==="@"){switchFlow(nx.slice(1),key);return}
   goStep(key,nx);return}
 const n=e.target.closest("[data-next]");if(n){const key=n.dataset.flow,S=state.flow[key],s=FLOWS[key].steps.find(x=>x.id===n.dataset.next),v=$("#f-"+s.id).value.trim();if(v)S.ans[s.key]=v;else delete S.ans[s.key];goStep(key,s.next);return}
 const j=e.target.closest("[data-jump]");if(j){e.preventDefault();goStep(j.dataset.flow,j.dataset.jump);return}
 const sm=e.target.closest("[data-sum]");if(sm){const key=sm.dataset.sum,S=state.flow[key];const t=`🐝 Resumo do lead (${FLOWS[key].title})\n`+FLOWS[key].keys.filter(k=>S.ans[k]).map(k=>`• ${k}: ${S.ans[k]}`).join("\n");copy(t,sm);return}
 const rs=e.target.closest("[data-reset]");if(rs){const key=rs.dataset.reset;state.flow[key]={cur:FLOWS[key].steps[0].id,ans:{}};render(state.flow[key].cur);toast("Pronto para o próximo lead");return}
});
let qt;$("#q").addEventListener("input",e=>{clearTimeout(qt);qt=setTimeout(()=>{state.q=e.target.value;render()},150)});

const h0=location.hash.slice(1);if(ROUTES.some(r=>r.id===h0))state.route=h0;
render();
</script>

</body></html>
