<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Central SDR BeeFood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/styles.css">

<body>
<div class="app">

        <input id="q" type="search" placeholder="Buscar: totem, Stone, nota fiscal, planos…" autocomplete="off" aria-label="Buscar no site"></label>

  </div></div>
</div>
<div class="toast" id="toast" hidden></div>
